name: Construir APK Modo Hueso

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Bajar tus archivos
        uses: actions/checkout@v4
        
      - name: 2. Instalar Java (necesario para compilar Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: 3. Dar permiso al compilador
        run: chmod +x ./gradlew
        
      - name: 4. Compilar APK Modo Hueso (con tu BoneCore + SingularityCrypto)
        run: ./gradlew assembleDebug
        
      - name: 5. Subir APK para que la bajes
        uses: actions/upload-artifact@v4
        with:
          name: ModoHueso-APK-DavidLab
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
