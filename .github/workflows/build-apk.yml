name: Construir APK Modo Hueso v2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Bajar tus archivos
        uses: actions/checkout@v5

      - name: 2. Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Gradle 8.2 SIN cache
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          echo "/tmp/gradle-8.2/bin" >> $GITHUB_PATH
          gradle --version

      - name: 4. Armar estructura Android SIMPLIFICADA
        run: |
          mkdir -p app/src/main/java/com/david/psyche/bone
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          cp MainActivity.kt app/src/main/java/com/david/psyche/bone/ 2>/dev/null || echo "MainActivity faltante"
          cp ModoHueso-APK-Fuente.kt app/src/main/java/com/david/psyche/bone/ 2>/dev/null || echo "Fuente faltante"
          cp SingularityCrypto.kt app/src/main/java/com/david/psyche/bone/ 2>/dev/null || echo "Singularity faltante"
          # settings.gradle MINIMO - solo 2 lineas, sin pluginManagement que fallaba
          printf 'rootProject.name = "ModoHueso"\ninclude ":app"\n' > settings.gradle
          cat settings.gradle
          # build.gradle raiz simple
          cat > build.gradle << 'EOF'
          buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.application:8.2.2' classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android { namespace 'com.david.psyche.bone'; compileSdk 34; defaultConfig { applicationId "com.david.psyche.bone"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" } buildTypes { release { minifyEnabled false } } compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 } kotlinOptions { jvmTarget = '1.8' } buildFeatures { viewBinding true } }
          dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.11.0' }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:label="Modo Hueso - David Lab" android:theme="@style/Theme.AppCompat.DayNight.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:padding="16dp" android:background="#0A0A12" android:layout_width="match_parent" android:layout_height="match_parent">
          <TextView android:text="MODO HUESO - David Lab" android:textColor="#FFC107" android:textSize="18sp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
          <TextView android:id="@+id/tvHardness" android:textColor="#FFFFFF" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
          <TextView android:id="@+id/tvTarpit" android:textColor="#FFFFFF" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
          <TextView android:id="@+id/tvArgon" android:textColor="#FFFFFF" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
          <TextView android:id="@+id/tvYears" android:textColor="#4CAF50" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
          <EditText android:id="@+id/etPassword" android:hint="Clave" android:textColor="#FFFFFF" android:layout_width="match_parent" android:layout_height="wrap_content"/>
          <Button android:id="@+id/btnLogin" android:text="PROBAR ACCESO" android:layout_width="match_parent" android:layout_height="wrap_content"/>
          <TextView android:id="@+id/tvStatus" android:textColor="#FFFFFF" android:layout_width="match_parent" android:layout_height="wrap_content"/>
          <TextView android:id="@+id/tvLogs" android:textColor="#CCCCCC" android:layout_width="match_parent" android:layout_height="200dp"/>
          <Button android:id="@+id/btnClearLogs" android:text="Limpiar" android:layout_width="match_parent" android:layout_height="wrap_content"/>
          <ProgressBar android:id="@+id/progressBone" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="20dp"/>
          </LinearLayout>
          EOF
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources><style name="Theme.AppCompat.DayNight.DarkActionBar" parent="Theme.AppCompat.Light.DarkActionBar"/></resources>
          EOF
          ls -R

      - name: 5. Compilar APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: 6. Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ModoHueso-APK-DavidLab
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
